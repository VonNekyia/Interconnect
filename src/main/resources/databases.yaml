adminer-editor:
  enabled: true
  host: 127.0.0.1
  port: 8090

local-mariadb:
  port: 13306

plugin-versions:
  selected: "26.2"
  folder-pattern: "plugins-%version%"
  plugins:
    - BetonQuest
    - ChatControl
    - Citizens
    - FastAsyncWorldEdit
    - InteractiveChat
    - InteractiveChat-PacketEvents
    - LuckPerms
    - Nations
    - Nexo
    - PacketEvents
    - PlaceholderAPI
    - Pl3xMap
    - PlayerActionAdapter
    - Proficisci
    - TerranovaLib
    - Vault
    - WorldGuard

bootstrap:
  commands:
    - 'lp group default permission set chatcontrol.channel.standard true'
    - 'lp group default permission set chatcontrol.channel.join.standard.write true'
    - 'lp group default permission set chatcontrol.channel.autojoin.standard.write true'
    - 'lp group default meta setprefix 100 "&7[Player] "'

databases:
  - network
  - nations
  - betonquest
  - chatcontrol
  - interactivechat
  - luckperms

accounts:
  - username: minecraft
    password: minecraft
    root: true
