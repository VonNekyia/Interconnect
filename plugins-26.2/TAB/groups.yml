Player:
  tabprefix: "&0&l[&7&lPlayer&0&l] &3"
  tagprefix: "&2&lPlayer &3"

# Default settings for all groups. A group's own section overrides these.
# Valid properties: tagprefix, tagsuffix, tabprefix, tabsuffix, customtabname
#
# These read through ChatControl rather than LuckPerms directly, which is what
# ChatControl asks for when TAB is installed. ChatControl still sources the
# prefix from LuckPerms via Vault, but routing it through ChatControl means a
# player's nickname and ChatControl's own formatting show up in the tablist and
# above their head, not just in chat.
_DEFAULT_:
  tabprefix: "%chatcontrol_player_prefix_section% "
  tagprefix: "%chatcontrol_player_prefix_section% "
  customtabname: "%chatcontrol_player_nick_section%"
  tabsuffix: "%chatcontrol_player_suffix_section%"
  tagsuffix: "%chatcontrol_player_suffix_section%"

per-world:
  world1:
    Owner:
      tabprefix: "&0&l[&a&lOwner&0&l] &a"
      tagprefix: "&2&lOwner &a"
